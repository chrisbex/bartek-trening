<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Bridge Master - Studio Nauki Brydża</title>
    <meta name="description" content="Profesjonalna aplikacja do nauki gry w brydża sportowego. Umożliwia tworzenie własnych rozdań, prowadzenie licytacji, rozgrywkę z walidacją reguł oraz notatki metodyczne dla uczniów." />
    <meta property="og:title" content="Studio Nauki Brydża" />
    <meta property="og:description" content="Profesjonalna aplikacja do nauki gry w brydża sportowego. Umożliwia tworzenie własnych rozdań, prowadzenie licytacji, rozgrywkę z walidacją reguł oraz notatki metodyczne dla uczniów." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Defensive guard against browser extensions (e.g. MetaMask, ad-blockers, request interceptors)
      // that fail when injecting content scripts or attempting to overwrite window.fetch
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (e) {
          // Ignore if cannot redefine
        }

        // Catch extension errors and unhandled rejections from chrome-extension:// origins
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (event.message.indexOf('fetch of #<Window>') !== -1 || event.message.indexOf('MetaMask') !== -1))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var stack = (reason && reason.stack) ? String(reason.stack) : '';
          var msg = (reason && reason.message) ? String(reason.message) : String(reason || '');
          if (
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('MetaMask') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
